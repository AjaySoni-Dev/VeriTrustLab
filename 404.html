<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A1A1A">
  <title>Page Not Found | VeriTrust</title>
  <meta name="description" content="The requested VeriTrust page could not be found. Return to email investigation or the main site.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base/veritrust.css">
  <link rel="stylesheet" href="/assets/css/base/glass-system.css">
  <script src="/assets/js/core/config.js"></script>
  <script src="/assets/js/core/supabase-client.js" defer></script>
  <script src="/assets/js/core/site.js" defer></script>
  <style>
    .not-found-shell{min-height:calc(100vh - 9rem);display:grid;place-items:center;padding:clamp(4rem,10vw,8rem) 1.25rem}.not-found-card{width:min(720px,100%);text-align:center}.not-found-code{font:600 clamp(4.5rem,16vw,9rem)/.9 'IBM Plex Mono',monospace;color:var(--accent-main,#01afaf);letter-spacing:-.08em}.not-found-card h1{margin:1.2rem 0 .7rem;font-size:clamp(2rem,5vw,3.4rem)}.not-found-card p{max-width:600px;margin:0 auto 1.5rem;color:var(--text-secondary,#c2c2c2);line-height:1.7}.not-found-actions{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap}
  </style>
</head>
<body class="vt-tool-page">
  <main class="not-found-shell">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <div class="not-found-code" aria-hidden="true">404</div>
      <h1 id="not-found-title">Page not found.</h1>
      <p>The address may have changed or the requested workflow is not available in this deployment. Return to the main email investigation workspace or review the platform documentation.</p>
      <div class="not-found-actions"><a class="btn btn-primary" href="/phishing">Investigate email</a><a class="btn btn-secondary" href="/">Return home</a><a class="btn btn-secondary" href="/docs">View docs</a></div>
    </section>
  </main>
</body>
</html>
